[project]
name = "github-intelligence-analytics"
version = "0.1.0"
description = "Pure metric, health, and detection logic for GitHub Engineering Intelligence"
requires-python = ">=3.12"
# Deliberately dependency-free: this package must stay importable without FastAPI, SQLAlchemy,
# or any I/O library so every number it produces is reproducible from plain inputs.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
